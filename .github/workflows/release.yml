name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing X.Y.Z tag to release"
        required: true
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be strict X.Y.Z: $REQUESTED_TAG" >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag and manifest version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          MANIFEST_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$MANIFEST_VERSION" = "$RELEASE_TAG"
          cargo publish --locked --dry-run

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: cgen-linux-amd64
            packages: ""
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: cgen-linux-amd64-musl
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: cgen-linux-arm64
            packages: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: cgen-macos-amd64
            packages: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: cgen-macos-arm64
            packages: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: cgen-windows-amd64.exe
            packages: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux cross-linker
        if: runner.os == 'Linux' && matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/cgen ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/cgen.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum cgen-* > checksums.sha256

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true

  publish-crate:
    needs: [validate, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish exact release source
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
