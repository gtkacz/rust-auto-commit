[package]
name = "auto-commit-rs"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
description = "Fast, lightweight CLI tool that generates git commit messages using LLMs. Single binary, no runtime dependencies."
license = "MIT"
repository = "https://github.com/gtkacz/smart-commit-rs"
homepage = "https://github.com/gtkacz/smart-commit-rs"
documentation = "https://github.com/gtkacz/smart-commit-rs"
readme = "README.md"
keywords = ["git", "commit", "llm", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Gabriel Tkacz <gabriel@tkacz.dev>"]

[[bin]]
name = "cgen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
dirs = "6"
dotenvy = "0.15"
fs2 = "0.4"
indicatif = "=0.18.6"
inquire = { version = "0.7", default-features = false, features = ["crossterm"] }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
tempfile = "=3.27.0"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
glob = "0.3"

[dev-dependencies]
mockito = "1"
serial_test = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
